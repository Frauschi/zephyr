common:
  depends_on: netif
  min_ram: 32
  min_flash: 260
  tags:
    - net
    - socket
    - tls
  filter: CONFIG_FULL_LIBC_SUPPORTED
  integration_platforms:
    - qemu_x86
  platform_exclude: vmu_rt1170/mimxrt1176/cm7 # See #61129
tests:
  net.socket.tls:
    extra_configs:
      - CONFIG_NET_TC_THREAD_COOPERATIVE=y
  net.socket.tls.preempt:
    extra_configs:
      - CONFIG_NET_TC_THREAD_PREEMPTIVE=y
    platform_exclude: mps2/an385
  net.socket.tls.sendmsg_no_buf:
    extra_configs:
      - CONFIG_NET_SOCKETS_DTLS_SENDMSG_BUF_SIZE=0
  net.socket.tls.wolfssl:
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
    tags: wolfssl
    extra_args:
      - EXTRA_CONF_FILE=overlay-wolfssl.conf
  net.socket.tls.wolfssl_ocsp_stapling:
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
    tags: wolfssl
    extra_args:
      - EXTRA_CONF_FILE=overlay-wolfssl.conf
    extra_configs:
      - CONFIG_NET_SOCKETS_TLS_WOLFSSL_OCSP_STAPLING=y
  # Build-only: must-staple fails every handshake here, because the test's
  # own TLS server has no OCSP response to staple.
  net.socket.tls.wolfssl_ocsp_must_staple:
    build_only: true
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
    tags: wolfssl
    extra_args:
      - EXTRA_CONF_FILE=overlay-wolfssl.conf
    extra_configs:
      - CONFIG_NET_SOCKETS_TLS_WOLFSSL_OCSP_STAPLING=y
      - CONFIG_NET_SOCKETS_TLS_WOLFSSL_OCSP_MUST_STAPLE=y
