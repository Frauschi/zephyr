common:
  depends_on: netif
  min_ram: 32
  min_flash: 260
  tags:
    - net
    - socket
    - tls
  filter: CONFIG_FULL_LIBC_SUPPORTED
  platform_exclude: vmu_rt1170/mimxrt1176/cm7 # See #61129
  # integration_platforms is set per scenario, since twister would merge a common
  # qemu_x86 entry into the native_sim-only wolfssl scenarios.
tests:
  net.socket.tls:
    extra_configs:
      - CONFIG_NET_TC_THREAD_COOPERATIVE=y
    integration_platforms:
      - qemu_x86
  net.socket.tls.preempt:
    extra_configs:
      - CONFIG_NET_TC_THREAD_PREEMPTIVE=y
    platform_exclude: mps2/an385
    integration_platforms:
      - qemu_x86
  net.socket.tls.sendmsg_no_buf:
    extra_configs:
      - CONFIG_NET_SOCKETS_DTLS_SENDMSG_BUF_SIZE=0
    integration_platforms:
      - qemu_x86
  net.socket.tls.no_dtls_cid:
    extra_configs:
      - CONFIG_MBEDTLS_SSL_DTLS_CONNECTION_ID=n
    integration_platforms:
      - qemu_x86
  net.socket.tls.session_persistent:
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
    extra_configs: &session_persistent_configs
      - CONFIG_FLASH=y
      - CONFIG_FLASH_MAP=y
      - CONFIG_NVS=y
      - CONFIG_SETTINGS=y
      - CONFIG_SETTINGS_NVS=y
      - CONFIG_NET_SOCKETS_TLS_SESSION_CACHE_PERSISTENT=y
  net.socket.tls.wolfssl:
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
    tags: wolfssl
    extra_args:
      - CONF_FILE=prj_wolfssl.conf
  net.socket.tls.wolfssl_ocsp_stapling:
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
    tags: wolfssl
    extra_args:
      - CONF_FILE=prj_wolfssl.conf
    extra_configs:
      - CONFIG_NET_SOCKETS_TLS_WOLFSSL_OCSP_STAPLING=y
  # Build-only: must-staple fails every handshake here, because the test's
  # own TLS server has no OCSP response to staple.
  net.socket.tls.wolfssl_ocsp_must_staple:
    build_only: true
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
    tags: wolfssl
    extra_args:
      - CONF_FILE=prj_wolfssl.conf
    extra_configs:
      - CONFIG_NET_SOCKETS_TLS_WOLFSSL_OCSP_STAPLING=y
      - CONFIG_NET_SOCKETS_TLS_WOLFSSL_OCSP_MUST_STAPLE=y
  net.socket.tls.wolfssl_session_persistent:
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
    tags: wolfssl
    extra_args:
      - CONF_FILE=prj_wolfssl.conf
    extra_configs: *session_persistent_configs
