common:
  tags:
    - net
    - socket
    - tls
tests:
  net.socket.tls.ext:
    platform_allow: qemu_x86
    integration_platforms:
      - qemu_x86

  net.socket.tls.ext.wolfssl:
    platform_allow:
      - native_sim
      - native_sim/native/64
    tags: wolfssl
    extra_args:
      - EXTRA_CONF_FILE=overlay-wolfssl.conf

  net.socket.tls.ext.wolfssl.ocsp_stapling:
    platform_allow:
      - native_sim
      - native_sim/native/64
    tags: wolfssl
    extra_args:
      - EXTRA_CONF_FILE=overlay-wolfssl.conf
    extra_configs:
      - CONFIG_TLS_MAX_CREDENTIALS_NUMBER=9
      - CONFIG_NET_SOCKETS_TLS_WOLFSSL_OCSP_STAPLING=y
  net.socket.tls.ext.wolfssl.ocsp_must_staple:
    platform_allow:
      - native_sim
      - native_sim/native/64
    tags: wolfssl
    extra_args:
      - EXTRA_CONF_FILE=overlay-wolfssl.conf
    extra_configs:
      - CONFIG_TLS_MAX_CREDENTIALS_NUMBER=9
      - CONFIG_NET_SOCKETS_TLS_WOLFSSL_OCSP_STAPLING=y
      - CONFIG_NET_SOCKETS_TLS_WOLFSSL_OCSP_MUST_STAPLE=y
      - CONFIG_ZTEST_VERIFY_RUN_ALL=n
  net.socket.tls.ext.wolfssl.verify_cb:
    platform_allow:
      - native_sim
      - native_sim/native/64
    tags: wolfssl
    extra_args:
      - EXTRA_CONF_FILE=overlay-wolfssl-verify-cb.conf
